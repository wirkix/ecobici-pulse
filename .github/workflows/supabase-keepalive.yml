name: Supabase keep-alive

# Supabase's Free plan auto-pauses a project after 7 consecutive days with
# no API activity. This pings the project's REST (PostgREST) endpoint every
# 3 days -- comfortably under that window -- so it never goes idle long
# enough to trigger the pause. No effect on billing; the anon/publishable
# key is the same one already shipped client-side in web/'s deployed app.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
